name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Validate release tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == "$GITHUB_REF_NAME" || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must be a semantic version such as v0.1.0" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: go test -race ./...

      - name: Build release assets
        run: |
          asset_root="${RUNNER_TEMP}/govulncheck-ignore-release"
          dist="${asset_root}/dist"
          stage="${asset_root}/stage"
          mkdir -p "$dist" "$stage"
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="govulncheck-ignore_${VERSION}_${goos}_${goarch}"
            binary="${stage}/${goos}_${goarch}/govulncheck-ignore"
            if [[ "$goos" == "windows" ]]; then
              binary="${binary}.exe"
            fi

            mkdir -p "$(dirname "$binary")"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "$binary" .

            if [[ "$goos" == "windows" ]]; then
              zip -j -q "${dist}/${name}.zip" "$binary"
            else
              tar -C "$(dirname "$binary")" -czf "${dist}/${name}.tar.gz" "$(basename "$binary")"
            fi
          done
          (
            cd "$dist"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum govulncheck-ignore_* > checksums.txt
            else
              shasum -a 256 govulncheck-ignore_* > checksums.txt
            fi
          )
          echo "DIST_DIR=$dist" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$DIST_DIR"/* \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
